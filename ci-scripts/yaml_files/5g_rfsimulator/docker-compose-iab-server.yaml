              chrt -f 80 /opt/oai-gnb/bin/nr-softmodem -O /tmp/gnb.conf --rfsim --rfsimulator.serverport 4044 --telnetsrv --backhaul-mt-telnet-port 9189 --log_config.global_log_options level,nocolor,time &
              NR_PID=$$!
