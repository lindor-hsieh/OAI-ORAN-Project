[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iab-fl-app"
version = "0.1.0"
description = "O-RAN IAB Global rApp (ServerApp) / Local rApp Flower Client (ClientApp)"
license = "Apache-2.0"
dependencies = [
    "torch>=2.2.0",
    "pymongo>=4.6",
    "numpy>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["iab_fl"]

[tool.flwr.app]
publisher = "iab-thesis"

[tool.flwr.app.components]
serverapp = "iab_fl.server_app:app"
clientapp = "iab_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 1
local-epochs = 10

# SuperLink 連線設定（1.26.0 起不再放這裡，改放 $FLWR_HOME/config.toml
# 的 [superlink]/[superlink.<name>] 區塊，見 ../flwr_config.toml，
# Dockerfile 會把它 COPY 到 /root/.flwr/config.toml 烤進 image）。
