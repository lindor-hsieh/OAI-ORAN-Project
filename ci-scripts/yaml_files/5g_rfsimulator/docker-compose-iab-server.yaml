version: '3.8'

services:
    # ==========================================================
    # 0. O-RAN Infrastructure (RIC & xApps)
    # ==========================================================
    oai-flexric:
        image: oaisoftwarealliance/oai-flexric:develop
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        container_name: flexric
        restart: always
        networks:
            public_net:
                ipv4_address: 192.168.88.141
        ports:
            - "36421:36421/sctp"
            - "36422:36422/sctp"
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/ric/nearRT-RIC:/usr/local/bin/nearRT-RIC
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s

    xapp-kpm-moni:
        image: oaisoftwarealliance/oai-flexric:develop
        command: "stdbuf -o0 /xapp_kpm_moni"
        container_name: xapp-kpm-moni
        privileged: true
        cap_add: [NET_ADMIN]
        depends_on:
            oai-flexric:
                condition: service_healthy
        restart: on-failure
        network_mode: "host"
        environment:
            - NEAR_RT_RIC_IP=192.168.88.141
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/monitor/xapp_kpm_moni:/xapp_kpm_moni
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/

    # ==========================================================
    # 0-a. MongoDB (經驗持久化，供 12 個節點的 inference 容器共用)
    # ==========================================================
    mongodb:
        image: mongo:7.0
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    # ==========================================================
    # 0-b. Python 推論伺服器 + C xApp（12 個節點，全部集中在 PC1）
    #   刻意選擇：xApp/inference 不跟著 RAN 節點搬到 PC2/PC3，理由見 CLAUDE.md。
    #   Global xApp（全域公平性廣播）+ Global rApp（Flower FedAvg）服務定義
    #   見下方 0-c 區塊（Stage 2 起新增，掛 profiles: ["stage2-fl"]）。
    #
    #   全部 12 個 inference-nodeN 都釘在 cpuset: "12-15"（Stage 2 上線時的
    #   root cause 修復，2026-09-13）：Stage 2 首次讓全部 12 個 Local rApp
    #   同時做真實 DRL 推論+背景訓練，PC1 同時還跑著 Donor CU/DU + Node2/7/8
    #   三組即時 RT-priority（chrt -f 80）softmodem，兩者疊加造成 CPU load
    #   average 一度飆到 37（16 核心主機），觸發全部 xApp 的 30 秒 watchdog
    #   連鎖重連，最終壓垮 FlexRIC 的 pending event queue 崩潰一次。把 DRL
    #   推論/訓練負載硬性限制在 4 個核心內、跟 RT-priority 的 DU/MT 執行緒
    #   物理隔離後，load average 降回 7~9，未再復發。詳見
    #   experiment_results/avgFL.md「上線前的清理與除錯過程」第 3 點。
    #
    #   ⚠️ 2026-09-14 教訓：不要無條件把其他容器（Global xApp／Flower FL
    #   服務）也加進同一組 "12-15"！這裡是 12 個 inference-nodeN 專用、已
    #   驗證穩定的隔離區，曾經誤把 global-xapp/flower-superlink/12 個
    #   flower-supernode-nodeN/flower-scheduler（共 15 個服務）也塞進同一組
    #   4 核心（變成 27 個 process 擠 4 核心），造成 rfsim5g-donor-cu 隨機
    #   崩潰，且瞬時 CPU 使用率看起來完全不誇張（mpstat 平均僅 30% 上下）、
    #   很難聯想到是 cpuset 過度擁擠。新增容器隔離前先確認這組核心目前塞了
    #   多少 process，見 CLAUDE.md 第 7 節「容器隨機崩潰排查指南」第 1 點。
    # ==========================================================
    inference-node1:
        image: local-xapp-inference:latest
        container_name: inference-node1
        network_mode: "host"
        cpuset: "12-15"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "1"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
            REWARD_MODE: "${REWARD_MODE:-lagrangian}"
            MODEL_ARCH: "${MODEL_ARCH:-mlp}"
        volumes:
            - /tmp:/tmp
            - inference_models_node1:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    node1-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node1
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node1:/node1_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node1.sh:/start_xapp_node1.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node1.sh
