version: '3.8'

services:
    # ==========================================
    # IAB Node 3 (Left Leaf)
    # ==========================================
    rfsim5g-iab-mt-3:
        build: { context: ., dockerfile: Dockerfile.ue }
        container_name: rfsim5g-iab-mt-3
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        networks:
            # 外部：與 PC 1 實體連通
            macvlan_net:
                ipv4_address: 192.168.88.30
            # 內部：與 DU 連通
            iab_internal_net:
                ipv4_address: 192.168.74.10
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        environment:
            # 連接 PC 1 (192.168.88.1)
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.1 --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time
    
    rfsim5g-iab-du-3:
        image: oaisoftwarealliance/oai-gnb:develop
        container_name: rfsim5g-iab-du-3
        privileged: true
        user: "0:0"
        depends_on: [rfsim5g-iab-mt-3]
        networks:
            macvlan_net:
                ipv4_address: 192.168.88.31   # [新增] 讓 DU 直接有外部 IP
            # [關鍵] DU 只有內部 IP，強迫流量走 MT
            iab_internal_net:
                ipv4_address: 192.168.74.20
        volumes:
            - ./conf/iab_du_3.conf:/opt/oai-gnb/etc/gnb.conf
            # [關鍵] 替換成 PC 2 本地存放的修改版檔案
            - ~/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            - ~/openairinterface5g/openair2/E2AP/flexric/build/src/sm/mac_sm/libmac_sm.so:/usr/local/lib/libmac_sm.so
        entrypoint: /opt/oai-gnb/bin/nr-softmodem
        command: -O /opt/oai-gnb/etc/gnb.conf --rfsim --rfsimulator.[0].serveraddr server --rfsimulator.[0].serverport 4046
        environment:
            RFSIMULATOR: server

    # ==========================================
    # IAB Node 4 (Middle)
    # ==========================================
