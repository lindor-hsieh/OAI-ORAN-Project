version: '3.8'

services:
    # ==========================================================
    # 0. O-RAN Infrastructure (RIC & xApps)
    # ==========================================================
    oai-flexric:
        image: oaisoftwarealliance/oai-flexric:develop
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        container_name: flexric
        restart: always
        networks:
            public_net:
                ipv4_address: 192.168.88.141
        ports:
            - "36421:36421/sctp"
            - "36422:36422/sctp"
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/ric/nearRT-RIC:/usr/local/bin/nearRT-RIC
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s

    xapp-kpm-moni:
        image: oaisoftwarealliance/oai-flexric:develop
        command: "stdbuf -o0 /xapp_kpm_moni"
        container_name: xapp-kpm-moni
        privileged: true
        cap_add: [NET_ADMIN]
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            - NEAR_RT_RIC_IP=192.168.88.141
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/monitor/xapp_kpm_moni:/xapp_kpm_moni
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/

    # ==========================================================
    # 0-a. MongoDB (經驗持久化，供 12 個節點的 inference 容器共用)
    # ==========================================================
    mongodb:
        image: mongo:7.0
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    # ==========================================================
    # 0-b. Python 推論伺服器 + C xApp（12 個節點，全部集中在 PC1）
    #   刻意選擇：xApp/inference 不跟著 RAN 節點搬到 PC2/PC3，理由見 CLAUDE.md。
    #   本輪不含 Global xApp 配額橋接與 Flower 聯邦學習（見 CLAUDE.md 第五階段註記）。
    # ==========================================================
    inference-node1:
        image: local-xapp-inference:latest
        container_name: inference-node1
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "1"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            - inference_models_node1:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    node1-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node1
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node1:/node1_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node1.sh:/start_xapp_node1.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node1.sh
    inference-node2:
        image: local-xapp-inference:latest
        container_name: inference-node2
        network_mode: "host"
        depends_on:
            mongodb:
