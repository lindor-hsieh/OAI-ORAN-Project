    # 0-c. Stage 2 起：Global xApp（全域公平性廣播）+ Global rApp（Flower FedAvg）
    #   全部掛 profiles: ["stage2-fl"]，Stage 1 PF baseline 重跑（不帶 --profile）
    #   時完全不受影響。設計理由見 CLAUDE.md 第 2、3 節；量測結果見
    #   experiment_results/avgFL.md。
    # ==========================================================
    global-xapp:
        image: local-xapp-inference:latest
        container_name: global-xapp
        network_mode: "host"
        profiles: ["stage2-fl"]
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            GLOBAL_XAPP_NUM_NODES: "12"
            GLOBAL_XAPP_INTERVAL_S: "2"
            GLOBAL_XAPP_LOOKBACK: "50"
        volumes:
            - /tmp:/tmp
        command: ["python3", "global_xapp.py"]
        restart: on-failure

    # FL_MODE 是 server_app.py::main() 決定 instantiate IABFedAvg（avg，Stage 2，
    # 預設值）還是 IABClusterFedAvg（cluster，Stage 3）的開關，比照 REWARD_MODE
    # 的既有模式，見 CLAUDE.md 第 3 節。PYTHONUNBUFFERED=1 是 2026-09-14 除錯
    # Stage 3 時補上的——沒有這個，server_app.py 裡的 print() 會卡在這個長駐
    # process 的 stdio buffer 裡，docker logs 永遠看不到，很難確認到底套用的
    # 是哪個 FL_MODE、聚合有沒有真的跑。
    flower-superlink:
        image: local-xapp-inference:latest
        container_name: flower-superlink
        network_mode: "host"
        profiles: ["stage2-fl"]
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            APP_ROOT: "/app"
            PYTHONPATH: "/app"
            PYTHONUNBUFFERED: "1"
            FL_NUM_NODES: "12"
            FL_MODE: "${FL_MODE:-avg}"
            MODEL_ARCH: "${MODEL_ARCH:-mlp}"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR_NODE1: "/app/models_node1"
            MODEL_DIR_NODE2: "/app/models_node2"
            MODEL_DIR_NODE3: "/app/models_node3"
            MODEL_DIR_NODE4: "/app/models_node4"
            MODEL_DIR_NODE5: "/app/models_node5"
            MODEL_DIR_NODE6: "/app/models_node6"
            MODEL_DIR_NODE7: "/app/models_node7"
            MODEL_DIR_NODE8: "/app/models_node8"
            MODEL_DIR_NODE9: "/app/models_node9"
            MODEL_DIR_NODE10: "/app/models_node10"
            MODEL_DIR_NODE11: "/app/models_node11"
            MODEL_DIR_NODE12: "/app/models_node12"
        volumes:
            - inference_models_node1:/app/models_node1
            - inference_models_node2:/app/models_node2
            - inference_models_node3:/app/models_node3
            - inference_models_node4:/app/models_node4
            - inference_models_node5:/app/models_node5
            - inference_models_node6:/app/models_node6
            - inference_models_node7:/app/models_node7
            - inference_models_node8:/app/models_node8
            - inference_models_node9:/app/models_node9
            - inference_models_node10:/app/models_node10
            - inference_models_node11:/app/models_node11
            - inference_models_node12:/app/models_node12
        command: ["flower-superlink", "--insecure"]
        restart: on-failure

    # ==========================================================
    # 全部 12 個 flower-supernode-nodeN 都有 REWARD_MODE（2026-09-14 root
    # cause 修復）：這條路徑（client_app.py::train() -> training_pipeline.py
    # -> drl_agent.py::train_on_batch()）原本沒有這個環境變數，`drl_agent.py`
    # 用 os.getenv("REWARD_MODE", "lagrangian") 讀不到就悄悄用預設值
    # lagrangian，即使 inference-nodeN 那條路徑正確吃到 throughput_only 也一樣
