# ==========================================
# 網路定義區
# ==========================================
networks:
    macvlan_net:
        driver: macvlan
        driver_opts:
            parent: enxc84d44350008
        ipam:
            config:
                - subnet: 192.168.88.0/24
                  gateway: 192.168.88.1

    iab_internal_net:
        driver: bridge
        ipam:
            config:
                - subnet: 192.168.74.0/24