[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flwr"
version = "1.28.0"
description = "Flower: A Friendly Federated AI Framework (vendored, editable install)"
license = "Apache-2.0"
requires-python = ">=3.10,<4.0"
dependencies = [
    # 版本直接對齊官方 ~/flower/framework/uv.lock 已測試過的組合，避免用寬鬆
    # range 讓 pip 解析到新版但彼此不相容的套件（曾經因此炸掉：pip 解到
    # protobuf 6.33.6 + grpcio-health-checking 1.82.0，兩者 gencode/runtime
    # 版本不相容，flower-superlink 啟動時直接 VersionError crash）。
    "numpy==2.2.6",
    "grpcio==1.78.0",
    "grpcio-health-checking==1.71.2",
    "protobuf==5.29.6",
    "cryptography==46.0.5",
    "pycryptodome==3.23.0",
    "iterators==0.0.2",
    "typer==0.20.1",
    "tomli==2.4.0",
    "tomli-w==1.2.0",
    "pathspec==0.12.1",
    "rich==13.9.4",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "click==8.3.1",
    "SQLAlchemy==2.0.48",
    "alembic==1.18.4",
]

[project.scripts]
flwr = "flwr.cli.app:app"
flwr-simulation = "flwr.simulation.app:flwr_simulation"
flower-superlink = "flwr.server.app:run_superlink"
flower-supernode = "flwr.supernode.cli:flower_supernode"
flower-superexec = "flwr.supercore.cli:flower_superexec"
flwr-serverapp = "flwr.server.serverapp:flwr_serverapp"
flwr-clientapp = "flwr.supernode.cli:flwr_clientapp"

[tool.poetry]
packages = [{ include = "flwr" }]
