version: '3.8'

services:
    # ==========================================
    # IAB Node 3 (Left Leaf)
    # Parent: Node 1 on PC 1 (Port 4044)
    # Serving: UE 1, 2 (Port 4046)
    # ==========================================
    rfsim5g-iab-mt-3:
        build: { context: ., dockerfile: Dockerfile.ue }
        container_name: rfsim5g-iab-mt-3
        privileged: true
        network_mode: host
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        environment:
            # 連接 PC 1 (192.168.88.1) 的 Node 1 (Port 4044)
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.1 --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time

    rfsim5g-iab-du-3:
        image: oaisoftwarealliance/oai-gnb:develop
        container_name: rfsim5g-iab-du-3
        privileged: true
        depends_on: [rfsim5g-iab-mt-3]
        network_mode: host
        volumes:
            - ./conf/iab_du_3.conf:/opt/oai-gnb/etc/gnb.conf
        environment:
            # 服務本機 UE，監聽 Port 4046
            USE_ADDITIONAL_OPTIONS: --rfsim --rfsimulator.serverport 4046 --log_config.global_log_options level,nocolor,time

    # ==========================================
    # IAB Node 4 (Middle)
    # Parent: Node 1 on PC 1 (Port 4044)
    # Serving: UE 3, 4 (Port 4047)
