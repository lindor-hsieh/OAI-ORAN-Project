version: '3.8'

services:
    # ==========================================
    # 1. 5G Core Network (保持你不變的設定)
    # ==========================================
    mysql:
        container_name: "rfsim5g-mysql"
        image: mysql:8.0
        init: true
        volumes:
            - ./oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_net:
                ipv4_address: 192.168.71.131

    oai-amf:
        container_name: "rfsim5g-oai-amf"
        image: oaisoftwarealliance/oai-amf:v2.1.10
        environment:
            - TZ=Europe/paris
        volumes:
            - ./mini_nonrf_config.yaml:/openair-amf/etc/config.yaml
        depends_on:
            - mysql
        networks:
            public_net:
                ipv4_address: 192.168.71.132

    oai-smf:
        container_name: "rfsim5g-oai-smf"
        image: oaisoftwarealliance/oai-smf:v2.1.10
        environment:
            - TZ=Europe/Paris
        volumes:
            - ./mini_nonrf_config.yaml:/openair-smf/etc/config.yaml
        depends_on:
            - oai-amf
        networks:
            public_net:
                ipv4_address: 192.168.71.133

    oai-upf:
        container_name: "rfsim5g-oai-upf"
        image: oaisoftwarealliance/oai-upf:v2.1.10
        init: true
        environment:
            - TZ=Europe/Paris
        volumes:
            - ./mini_nonrf_config.yaml:/openair-upf/etc/config.yaml
        depends_on:
            - oai-smf
        cap_add:
            - NET_ADMIN
            - SYS_ADMIN
        cap_drop:
            - ALL
        privileged: true
        networks:
            public_net:
                ipv4_address: 192.168.71.134
                interface_name: eth0
            traffic_net:
                ipv4_address: 192.168.72.134
                interface_name: eth1

    oai-ext-dn:
        privileged: true
        container_name: rfsim5g-oai-ext-dn
        image: oaisoftwarealliance/trf-gen-cn5g:focal
        init: true
        entrypoint: /bin/bash -c \
              "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
              "ip route add 12.1.1.0/24 via 192.168.72.134 dev eth0; sleep infinity"
        depends_on:
            - oai-upf
        networks:
            traffic_net:
                ipv4_address: 192.168.72.135
        healthcheck:
            test: /bin/bash -c "ping -c 2 192.168.72.134"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5

    # ==========================================
    # 2. IAB Donor (原 oai-gnb)
    # ==========================================
    iab-donor:  # <--- 改名
        image: ${REGISTRY:-oaisoftwarealliance}/${GNB_IMG:-oai-gnb}:${TAG:-develop}
        container_name: rfsim5g-iab-donor
        cap_add:
            - SYS_NICE
        cap_drop:
            - ALL
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - oai-ext-dn

        cpuset: "0-3"

        networks:
            public_net:
                ipv4_address: 192.168.71.140
        # 這裡沿用你的 config，假設它是一個標準 gNB 設定
        volumes:
            - ../../conf_files/gnb.sa.band78.106prb.rfsim.yaml:/opt/oai-gnb/etc/gnb.yaml
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5

    # ==========================================
    # 3. IAB Node (MT + DU)
    # ==========================================
    
    # Part A: IAB-MT (使用 develop 版)
    iab-mt:
        image: oaisoftwarealliance/oai-nr-ue:develop  # <--- 您指定的 develop
        container_name: rfsim5g-iab-mt
        privileged: true
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - NET_RAW
            - SYS_NICE
        depends_on:
            - iab-donor

        cpuset: "4-7"

        networks:
            public_net:
                ipv4_address: 192.168.71.150
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
            - ../../conf_files/nrue.uicc.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
            # 掛載我們剛剛改寫的全能腳本
            - ./iab_conf/iab_router_init.sh:/opt/iab_router_init.sh
        
        # Entrypoint 變得很簡單：賦予執行權限 -> 執行它
        entrypoint: /bin/bash -c "chmod +x /opt/iab_router_init.sh && /opt/iab_router_init.sh"
        
    # Part B: IAB-DU (新增) - 負責服務 End UE
    iab-du:
        image: ${REGISTRY:-oaisoftwarealliance}/${GNB_IMG:-oai-gnb}:${TAG:-develop}
        container_name: rfsim5g-iab-du
        privileged: true
        depends_on: [iab-mt]

        cpuset: "8-11"

        network_mode: "service:iab-mt" # <--- 關鍵：與 MT 共用 IP (192.168.71.150)
        volumes:
            # ★★★ 修正：改掛載 .conf 檔，並掛載到 gnb.conf ★★★
            - ./iab_du.conf:/opt/oai-gnb/etc/gnb.conf
        # 這裡我們不掛載外部 config，改用 ENV 變數自動生成，以避免跟 Donor 的參數衝突
        environment:
            USE_SA_TDD_MONO: "yes"
            GNB_ID: "0xe01" # <--- 必須不同於 Donor (0xe00)
            GNB_NAME: "gNB-IAB-DU"
            MCC: "208"
            MNC: "99"
            MNC_LENGTH: "2"
            TAC: "1"
            NSSAI_SST: "1"
            AMF_IP_ADDRESS: "192.168.71.132"
            # 關鍵：NGA/NGU 必須填 MT 的 IP，因為它們共用網路
            GNB_NGA_IP_ADDRESS: "192.168.71.150"
            GNB_NGU_IP_ADDRESS: "192.168.71.150"
            GNB_NGA_IF_NAME: "eth0"
            GNB_NGU_IF_NAME: "eth0"
            USE_RFSIMULATOR: "yes"
            RFSIMULATOR_SERVERADDR: "server"
            # 關鍵：監聽 4044 Port，與 MT 區隔
            USE_ADDITIONAL_OPTIONS: --rfsim --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time
    # ==========================================
    # 4. End UE (原 oai-nr-ue2)
    # ==========================================
    end-ue:
        image: ${REGISTRY:-oaisoftwarealliance}/${NRUE_IMG:-oai-nr-ue}:${TAG:-develop}
        container_name: rfsim5g-end-ue
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN
            - NET_RAW
            - SYS_NICE
        environment:
            # 使用 IMSI 208990100001101 (UE2)
            # serveraddr 指向 IAB Node (192.168.71.150)
            # serverport 指向 4044 (DU 的 Port)
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001101 --rfsimulator.serveraddr 192.168.71.150 --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time
        depends_on:
            - iab-du

        cpuset: "12-15"

        networks:
            public_net:
                ipv4_address: 192.168.71.151
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
            - ../../conf_files/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5

    # (可選) 保留其他 UE，但建議先註解掉以免資源不足
    # oai-nr-ue3: ...

networks:
    public_net:
        driver: bridge
        name: rfsim5g-oai-public-net
        ipam:
            config:
                - subnet: 192.168.71.128/26
        driver_opts:
            com.docker.network.bridge.name: "rfsim5g-public"
    traffic_net:
        driver: bridge
        name: rfsim5g-oai-traffic-net
        ipam:
            config:
                - subnet: 192.168.72.128/26
        driver_opts:
            com.docker.network.bridge.name: "rfsim5g-traffic"