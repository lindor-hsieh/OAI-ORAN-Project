Active_gNBs = ( "gNB-IAB-DU-2" );
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID    = 0xe02;   # 與 Donor(e00) 和 IAB1(e01) 區隔
    gNB_DU_ID = 0xe02;   # edit
    gNB_name  = "gNB-IAB-DU-2"; # edit

    // Tracking area code
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1; }) });

    nr_cellid = 12345680L;  # edit

    ////////// Physical parameters:

    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 2; # PCI 為 2

      # Downlink Config
      # Frequency: 3319.68 MHz (保持同頻 IAB)
      absoluteFrequencySSB                                          = 621312;
      dl_absoluteFrequencyPointA                                    = 620040;
      dl_offstToCarrier                                             = 0;
      dl_subcarrierSpacing                                          = 1;
      dl_carrierBandwidth                                           = 106;
      
      # Initial BWP
      initialDLBWPlocationAndBandwidth                              = 28875;
      initialDLBWPsubcarrierSpacing                                 = 1;
      initialDLBWPcontrolResourceSetZero                            = 11;
      initialDLBWPsearchSpaceZero                                   = 0;

      # Uplink Config
      ul_frequencyBand                                              = 78;
      ul_offstToCarrier                                             = 0;
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      pMax                                                          = 20;
      
      initialULBWPlocationAndBandwidth                              = 28875;
      initialULBWPsubcarrierSpacing                                 = 1;

      # RACH Config
      prach_ConfigurationIndex                                      = 98;
      prach_msg1_FDM                                                = 0;
      prach_msg1_FrequencyStart                                     = 0;
      zeroCorrelationZoneConfig                                     = 12;
      preambleReceivedTargetPower                                   = -104;
      preambleTransMax                                              = 6;
      powerRampingStep                                              = 1;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                  = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                     = 15;
      ra_ContentionResolutionTimer                                  = 7;
      rsrp_ThresholdSSB                                             = 19;
      prach_RootSequenceIndex_PR                                    = 2;
      prach_RootSequenceIndex                                       = 1;
      msg1_SubcarrierSpacing                                        = 1;
      restrictedSetConfig                                           = 0;
      msg3_DeltaPreamble                                            = 1;
      p0_NominalWithGrant                                           = -90;

      # PUCCH Config
      pucchGroupHopping                                             = 0;
      hoppingId                                                     = 40;
      p0_nominal                                                    = -90;

      ssb_PositionsInBurst_Bitmap                                   = 1;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;
      referenceSubcarrierSpacing                                    = 1;

      # TDD Config (必須與全網保持一致)
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = 0;
    });

    # SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };
  }
);

MACRLCs = (
  {
    num_cc             = 1;
    tr_s_preference    = "local_L1";
    tr_n_preference    = "f1";

    # 設定本地 (DU/MT) 的 IP 介面
    ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## ## local_n_if_name    = "oaitun_ue1";
    local_n_address = "12.1.1.3";  # 佔位符，啟動腳本會自動替換成 MT-2 的實際 IP

    # 設定遠端 (Donor/CU) 的 IP (指向同一個 CU)
    remote_n_address   = "192.168.88.1"; 
    
    local_n_portc      = 38472; 
    local_n_portd      = 2152;  
    
    remote_n_portc     = 38472;
    remote_n_portd     = 2153;  

    pusch_TargetSNRx10 = 200;
    pucch_TargetSNRx10 = 200;
  }
);

L1s = (
{
  num_cc                = 1;
  tr_n_preference       = "local_mac";
  prach_dtx_threshold   = 200;
}
);

RUs = (
    {
       local_rf                      = "yes";
       nb_tx                         = 1;
       nb_rx                         = 1;
       att_tx                        = 0;
       att_rx                        = 0;
       bands                         = [78];
       max_pdschReferenceSignalPower = -27;
       max_rxgain                    = 75;
       eNB_instances                 = [0];
       sf_extension                  = 0;
       sdr_addrs                     = "serial=XXXXXXX";
    }
);

rfsimulator: {
    serveraddr = "server";
    serverport = 4045;
    options = ("chanmod");
};

channelmod = {
    max_chan = 10;
    DefaultChannelList = (
        {
            model_name  = "rfsimu_channel_ue0";
            type        = "AWGN";
            ploss_dB    = 0.0;
            noise_power_dB = -50.0;
            forgetfact  = 0.0;
            offset      = 0;
            ds_tdl      = 0.0;
        }
    );
};

log_config : {
  global_log_level                      ="info"; # reduce cpu loading
  f1ap_log_level                        ="info"; 
};

e2_agent = {
  near_ric_ip_addr = "192.168.88.141";
  sm_dir = "/usr/local/lib/flexric/"
};
telnetsrv : {
  listenport = 9090;
};
