version: '3.8'

services:
    # ==========================================
    # IAB Node 3 (Left Leaf) - 連接 PC 1
    # ==========================================
    rfsim5g-iab-mt-3:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-mt-3
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        networks:
            macvlan_net:
                ipv4_address: 192.168.88.30
            iab_internal_net:
                ipv4_address: 192.168.74.10
        devices:
             - /dev/net/tun:/dev/net/tun
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.150 --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
             - ~/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
             - ~/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem:/opt/oai-nr-ue/bin/nr-uesoftmodem
        command: >
            /bin/bash -c "/opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.150 --rfsimulator.serverport 4044 --log_config.global_log_options level,nocolor,time"

    rfsim5g-iab-du-3:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-du-3
        privileged: true
        depends_on: [rfsim5g-iab-mt-3]
        networks:
            macvlan_net:
                ipv4_address: 192.168.88.31
            iab_internal_net:
                ipv4_address: 192.168.74.20
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        volumes:
            - ./conf/iab_du_3.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - ~/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - ~/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            # [修正] 直接從宿主機的安裝目錄掛載
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --rfsim --rfsimulator.serverport 4046 --log_config.global_log_options level,nocolor,time

    # ==========================================
    # IAB Node 4 (Middle) - 連接 PC 1
