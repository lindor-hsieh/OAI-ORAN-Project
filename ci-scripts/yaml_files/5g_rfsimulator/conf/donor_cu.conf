    remote_s_address = "0.0.0.0";
    local_s_portc   = 38472;
    local_s_portd   = 2153;  # F1-U Port
    remote_s_portc  = 2152;
    remote_s_portd  = 2152;

    # SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.88.132"; });

    NETWORK_INTERFACES :
    {
        # 北向 (NG) - CU 宣告自己的身分 IP
