        # GNB_INTERFACE_NAME_FOR_NGU                 = "enxc84d44350030"; # [修改] 實體網卡
        GNB_IPV4_ADDRESS_FOR_NGU                   = "192.168.88.1";    # [修改] 實體 IP
        GNB_PORT_FOR_S1U                           = 2152;

        # 南向 F1 介面
        GNB_IPV4_ADDRESS_FOR_F1C                   = "192.168.88.1";    # [修改] 實體 IP
        GNB_PORT_FOR_F1C                           = 38472;
        GNB_IPV4_ADDRESS_FOR_F1U                   = "192.168.88.1";    # [修改] 實體 IP
        GNB_PORT_FOR_F1U                           = 2153;
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering        = "yes";
  drb_integrity        = "no";
};

