version: '3.8'

services:
    # ========================================== 
    # IAB Node 3 (relay) — 直連 Donor (跨主機 macvlan)
    # ==========================================
    rfsim5g-iab-mt-3:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-mt-3
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        networks:
            macvlan_net:
                ipv4_address: 192.168.88.152
        devices:
             - /dev/net/tun:/dev/net/tun
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.144 --rfsimulator.serverport 4043 --log_config.global_log_options level,nocolor,time
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem:/opt/oai-nr-ue/bin/nr-uesoftmodem
        ports:
            - "4046:4046/udp"
            - "4046:4046/tcp"
            - "127.0.0.1:9091:9091"   # Node 3 DU telnetsrv (chanmod control)
        command: /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001102 --rfsimulator.serveraddr 192.168.88.144 --rfsimulator.serverport 4043 --log_config.global_log_options level,nocolor,time

    rfsim5g-iab-du-3:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-du-3
        privileged: true
        depends_on: [rfsim5g-iab-mt-3]
        network_mode: "service:rfsim5g-iab-mt-3"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        volumes:
            - ./conf/iab_du_node3.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/libtelnetsrv.so:/usr/local/lib/libtelnetsrv.so:ro
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --rfsim --rfsimulator.serverport 4046 --telnetsrv --log_config.global_log_options level,nocolor,time

