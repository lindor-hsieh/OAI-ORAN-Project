                if [ -n "$$NEW_IP" ] && [ "$$NEW_IP" != "$$IP" ]; then
                  echo "[du-entrypoint] tunnel IP 改變（$$IP -> $$NEW_IP），重啟 nr-softmodem"
                  kill $$NR_PID 2>/dev/null
                  wait $$NR_PID 2>/dev/null
                  IP=$$NEW_IP
                  break
                fi
              done
              wait $$NR_PID 2>/dev/null
            done

    # ========================================== 
    # IAB Node 4 (relay) — 直連 Donor (跨主機 macvlan)
    # ==========================================

    rfsim5g-iab-mt-4:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-mt-4
        restart: on-failure
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        networks:
            macvlan_net:
                ipv4_address: 192.168.88.153
        devices:
             - /dev/net/tun:/dev/net/tun
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001103 --rfsimulator.serveraddr 192.168.88.144 --rfsimulator.serverport 4043 --telnetsrv --telnetsrv.listenport 9192 --log_config.global_log_options level,nocolor,time
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem:/opt/oai-nr-ue/bin/nr-uesoftmodem
        ports:
            - "4047:4047/udp"
            - "4047:4047/tcp"
            - "127.0.0.1:9092:9092"   # Node 4 DU telnetsrv (chanmod control)
            - "127.0.0.1:9192:9192"   # Node 4 MT telnetsrv (backhaul-aware PRB budget)
        command: chrt -f 80 /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001103 --rfsimulator.serveraddr 192.168.88.144 --rfsimulator.serverport 4043 --telnetsrv --telnetsrv.listenport 9192 --log_config.global_log_options level,nocolor,time

    rfsim5g-iab-du-4:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-du-4
        restart: on-failure
        privileged: true
        depends_on: [rfsim5g-iab-mt-4]
        network_mode: "service:rfsim5g-iab-mt-4"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        volumes:
            - ./conf/iab_du_node4.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/libtelnetsrv.so:/usr/local/lib/libtelnetsrv.so:ro
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command:
          - bash
          - -c
          - |
            IP=""
            for i in $(seq 1 60); do
              IP=$(ip -f inet addr show oaitun_ue1 2>/dev/null | grep -oP '(?<=inet\s)[0-9.]+' | head -1)
              [ -n "$$IP" ] && break
              sleep 2
            done
            if [ -z "$$IP" ]; then echo '[du-entrypoint] ERROR: oaitun_ue1 IP not ready after 120s'; exit 1; fi
            while true; do
              cp /opt/oai-gnb/etc/gnb.conf /tmp/gnb.conf
              sed -i "s|local_n_address = \"[0-9.]*\"|local_n_address = \"$$IP\"|" /tmp/gnb.conf
              echo "[du-entrypoint] local_n_address synced to $$IP，啟動 nr-softmodem"
              chrt -f 80 /opt/oai-gnb/bin/nr-softmodem -O /tmp/gnb.conf --rfsim --rfsimulator.serverport 4047 --telnetsrv --backhaul-mt-telnet-port 9192 --log_config.global_log_options level,nocolor,time &
              NR_PID=$$!
              while kill -0 $$NR_PID 2>/dev/null; do
                sleep 5
                NEW_IP=$(ip -f inet addr show oaitun_ue1 2>/dev/null | grep -oP '(?<=inet\s)[0-9.]+' | head -1)
                if [ -n "$$NEW_IP" ] && [ "$$NEW_IP" != "$$IP" ]; then
                  echo "[du-entrypoint] tunnel IP 改變（$$IP -> $$NEW_IP），重啟 nr-softmodem"
                  kill $$NR_PID 2>/dev/null
                  wait $$NR_PID 2>/dev/null
                  IP=$$NEW_IP
                  break
                fi
              done
              wait $$NR_PID 2>/dev/null
            done

