        image: local-xapp-inference:latest
        container_name: global-xapp
        network_mode: "host"
        profiles: ["stage2-fl"]
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            GLOBAL_XAPP_NUM_NODES: "12"
            GLOBAL_XAPP_INTERVAL_S: "2"
            GLOBAL_XAPP_LOOKBACK: "50"
        volumes:
            - /tmp:/tmp
        command: ["python3", "global_xapp.py"]
        restart: on-failure

