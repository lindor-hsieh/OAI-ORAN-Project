version: '3.8'

services:
    # ==========================================================
    # 0. O-RAN Infrastructure (RIC & xApps)
    # ==========================================================
    oai-flexric:
        image: oaisoftwarealliance/oai-flexric:develop
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        container_name: flexric
        restart: always
        networks:
            public_net:
                ipv4_address: 192.168.88.141
        ports:
            - "36421:36421/sctp"
            - "36422:36422/sctp"
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            # 掛載本地編譯的 nearRT-RIC，確保與 xapp_node3 使用相同 MAC SM wire format
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/ric/nearRT-RIC:/usr/local/bin/nearRT-RIC
            # 掛載所有本地編譯的 SM 插件，與 nearRT-RIC 及 xApp 保持 ABI 一致
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 15s

    xapp-kpm-moni:
        image: oaisoftwarealliance/oai-flexric:develop
        # 掛載本地編譯的 xapp_kpm_moni，與本地 nearRT-RIC E42 ABI 一致
        command: "stdbuf -o0 /xapp_kpm_moni"
        container_name: xapp-kpm-moni
        privileged: true
        cap_add: [NET_ADMIN]
        depends_on:
            oai-flexric:
                condition: service_healthy
        # [修改] 改用 Host 模式，這樣它就能透過宿主機的 macvlan-br 看到 FlexRIC
        network_mode: "host"
        environment:
            - NEAR_RT_RIC_IP=192.168.88.141
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/monitor/xapp_kpm_moni:/xapp_kpm_moni
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/

    # ==========================================================
    # 0-a. MongoDB (FL 訓練資料持久化)
    # ==========================================================
    mongodb:
        image: mongo:7.0
        container_name: mongodb
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    # ==========================================================
    # 0-b. Python 推論伺服器 (Near-RT 閉環 AI 推論)
    # ==========================================================
    inference-node1:
        image: local-xapp-inference:latest
        container_name: inference-node1
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "1"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            # 模型持久化：容器重啟後繼續使用已訓練的權重
            - inference_models_node1:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    inference-node2:
        image: local-xapp-inference:latest
        container_name: inference-node2
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "2"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            - inference_models_node2:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    inference-node3:
        image: local-xapp-inference:latest
        container_name: inference-node3
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "3"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            - inference_models_node3:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    inference-node4:
        image: local-xapp-inference:latest
        container_name: inference-node4
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "4"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            - inference_models_node4:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    inference-node5:
        image: local-xapp-inference:latest
        container_name: inference-node5
        network_mode: "host"
        depends_on:
            mongodb:
                condition: service_healthy
        environment:
            NODE_ID: "5"
            MONGO_URI: "mongodb://localhost:27017"
            MONGO_DB: "iab_xapp"
            MODEL_DIR: "/app/models"
        volumes:
            - /tmp:/tmp
            - inference_models_node5:/app/models
        command: ["python3", "main.py"]
        restart: on-failure

    node1-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node1
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node1:/node1_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node1.sh:/start_xapp_node1.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node1.sh

    node2-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node2
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node2:/node2_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node2.sh:/start_xapp_node2.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node2.sh

    node3-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node3
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            # -1 = 永久運行，不因 XAPP_DURATION timeout 退出
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            # xApp 執行檔 (編譯自 xapp_node3.c)
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node3:/node3_brain
            # 掛載所有本地編譯的 SM 插件，取代 Docker 版本以確保 ABI 一致
            # (Docker 的 libkpm_sm.so 等與本地靜態連結的 xApp ABI 不符會導致 SIGSEGV)
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            # 啟動腳本 (安裝 zmq/cjson + 等待 RIC 就緒)
            - ./iab/start_xapp_node3.sh:/start_xapp_node3.sh
            # /tmp 與宿主機共享，用於 ZMQ IPC socket:
            #   C xApp     → ipc:///tmp/zmq_node3_inference.ipc (REQ)
            #   Python 推論伺服器 → 同路徑 (REP)，需掛載同一個 /tmp
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node3.sh

    node4-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node4
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node4:/node4_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node4.sh:/start_xapp_node4.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node4.sh

    node5-l-xapp:
        image: custom-oai-runtime:24.04
        container_name: xapp-node5
        privileged: true
        tty: true
        restart: on-failure
        depends_on:
            oai-flexric:
                condition: service_healthy
        network_mode: "host"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/flexric
            NEAR_RT_RIC_IP: 192.168.88.141
            XAPP_DURATION: -1
        volumes:
            - ./conf/flexric.conf:/usr/local/etc/flexric/flexric.conf
            - /home/lindor/openairinterface5g/openair2/E2AP/flexric/build/examples/xApp/c/ctrl/xapp_node5:/node5_brain
            - /usr/local/lib/flexric/:/usr/local/lib/flexric/
            - ./iab/start_xapp_node5.sh:/start_xapp_node5.sh
            - /tmp:/tmp
        command: /bin/bash /start_xapp_node5.sh

    # ==========================================================
    # 1. 5G Core Network (AMF, SMF, UPF, MySQL)
    # ==========================================================
    mysql:
        container_name: "rfsim5g-mysql"
        image: mysql:8.0
        init: true
        volumes:
            - ./oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
            - ./mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
        environment:
            - TZ=Europe/Paris
            - MYSQL_DATABASE=oai_db
            - MYSQL_USER=test
            - MYSQL_PASSWORD=test
            - MYSQL_ROOT_PASSWORD=linux
        healthcheck:
            test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            public_net:
                ipv4_address: 192.168.88.131

    oai-amf:
        container_name: "rfsim5g-oai-amf"
        image: oaisoftwarealliance/oai-amf:v2.1.10
        volumes:
            - ./mini_nonrf_config.yaml:/openair-amf/etc/config.yaml
        depends_on: [mysql]
        networks:
            public_net:
                ipv4_address: 192.168.88.132

    oai-smf:
        container_name: "rfsim5g-oai-smf"
        image: oaisoftwarealliance/oai-smf:v2.1.10
        volumes:
            - ./mini_nonrf_config.yaml:/openair-smf/etc/config.yaml
        depends_on: [oai-amf]
        networks:
            public_net:
                ipv4_address: 192.168.88.133

    oai-upf:
        container_name: "rfsim5g-oai-upf"
        image: oaisoftwarealliance/oai-upf:v2.1.10
        init: true
        volumes:
            - ./mini_nonrf_config.yaml:/openair-upf/etc/config.yaml
        depends_on: [oai-smf]
        cap_add: [NET_ADMIN, SYS_ADMIN]
        privileged: true
        networks:
            public_net:
                ipv4_address: 192.168.88.134
                interface_name: eth0
            traffic_net:
                ipv4_address: 192.168.72.134
                interface_name: eth1

    oai-ext-dn:
        privileged: true
        container_name: rfsim5g-oai-ext-dn
        image: oaisoftwarealliance/trf-gen-cn5g:focal
        entrypoint: /bin/bash -c \
              "iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE;"\
              "ip route add 12.1.1.0/24 via 192.168.72.134 dev eth0; sleep infinity"
        depends_on: [oai-upf]
        networks:
            traffic_net:
                ipv4_address: 192.168.72.135

    # ==========================================================
    # 2. IAB Donor (Root Node)
    # ==========================================================
    rfsim5g-donor-cu:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-donor-cu
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        environment:
            USE_ADDITIONAL_OPTIONS: --log_config.global_log_options level,nocolor,time
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        depends_on: [oai-flexric, oai-upf]
        network_mode: "host"
        volumes:
            - ./conf/donor_cu.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            # [修正] 插件從宿主機安裝目錄掛載
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --log_config.global_log_options level,nocolor,time

    rfsim5g-donor-du:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-donor-du
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        environment:
            USE_ADDITIONAL_OPTIONS: --rfsim --log_config.global_log_options level,nocolor,time
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        depends_on: [rfsim5g-donor-cu]
        networks:
            public_net:
                ipv4_address: 192.168.88.144
        volumes:
            - ./conf/donor_du.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            # [修正] 插件從宿主機安裝目錄掛載
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        ports:
            - "4043:4043/udp"
            - "4043:4043/tcp"
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --rfsim --log_config.global_log_options level,nocolor,time

    # ==========================================================
    # 3. Layer 1: IAB Node 1 (Aggregator Left)
    # ==========================================================
    rfsim5g-iab-mt:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-mt
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        depends_on: [rfsim5g-donor-du]
        networks:
            public_net:
                ipv4_address: 192.168.88.150
        devices:
             - /dev/net/tun:/dev/net/tun
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001100 --rfsimulator.serveraddr 192.168.88.144 --log_config.global_log_options level,nocolor,time
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf  
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem:/opt/oai-nr-ue/bin/nr-uesoftmodem
        ports:
            - "4044:4044/udp"
            - "4044:4044/tcp"
            - "127.0.0.1:9089:9089"   # Node 1 DU telnetsrv (chanmod control)
        command: /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001100 --rfsimulator.serveraddr 192.168.88.144 --log_config.global_log_options level,nocolor,time

    rfsim5g-iab-du:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-du
        privileged: true
        depends_on: [rfsim5g-iab-mt]
        network_mode: "service:rfsim5g-iab-mt"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        volumes:
            - ./conf/iab_du.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/libtelnetsrv.so:/usr/local/lib/libtelnetsrv.so:ro
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --rfsim --rfsimulator.serverport 4044 --telnetsrv --log_config.global_log_options level,nocolor,time

    # ==========================================================
    # 4. Layer 1: IAB Node 2 (Aggregator Right)
    # ==========================================================
    rfsim5g-iab-mt-2:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-mt-2
        privileged: true
        cap_add: [NET_ADMIN, NET_RAW]
        networks:
            public_net:
                ipv4_address: 192.168.88.152
        devices:
             - /dev/net/tun:/dev/net/tun
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
            USE_ADDITIONAL_OPTIONS: --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001101 --rfsimulator.serveraddr 192.168.88.144 --log_config.global_log_options level,nocolor,time
        volumes:
             - ./conf/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf  
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
             - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-uesoftmodem:/opt/oai-nr-ue/bin/nr-uesoftmodem
        ports:
            - "4045:4045/udp"
            - "4045:4045/tcp"
            - "127.0.0.1:9090:9090"   # Node 2 DU telnetsrv (chanmod control)
        command: /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf --rfsim -r 106 --numerology 1 -C 3319680000 --ssb 516 --uicc0.imsi 208990100001101 --rfsimulator.serveraddr 192.168.88.144 --log_config.global_log_options level,nocolor,time

    rfsim5g-iab-du-2:
        image: custom-oai-runtime:24.04
        container_name: rfsim5g-iab-du-2
        privileged: true
        depends_on: [rfsim5g-iab-mt-2]
        network_mode: "service:rfsim5g-iab-mt-2"
        environment:
            LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/oai_libs
        volumes:
            - ./conf/iab_du_2.conf:/opt/oai-gnb/etc/gnb.conf
            - ./conf/flexric.conf:/opt/oai-gnb/etc/flexric.conf
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build:/usr/local/lib/oai_libs
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem:/opt/oai-gnb/bin/nr-softmodem
            - /home/lindor/openairinterface5g/cmake_targets/ran_build/build/libtelnetsrv.so:/usr/local/lib/libtelnetsrv.so:ro
            - /usr/local/lib/flexric/libmac_sm.so:/usr/local/lib/flexric/libmac_sm.so
            - /usr/local/lib/flexric/libkpm_sm.so:/usr/local/lib/flexric/libkpm_sm.so
        command: /opt/oai-gnb/bin/nr-softmodem -O /opt/oai-gnb/etc/gnb.conf --rfsim --rfsimulator.serverport 4045 --telnetsrv --log_config.global_log_options level,nocolor,time

networks:
    public_net:
        driver: macvlan
        driver_opts:
            parent: enxc84d44350030
        ipam:
            config:
                - subnet: 192.168.88.0/24
                  gateway: 192.168.88.1
    traffic_net:
        driver: bridge
        name: rfsim5g-oai-traffic-net
        ipam:
            config:
                - subnet: 192.168.72.128/26

volumes:
    mongo_data:
        name: iab-xapp-mongo-data
    # DRL 模型持久化 volume：各節點獨立儲存，容器重啟後繼續訓練
    inference_models_node1:
        name: iab-xapp-model-node1
    inference_models_node2:
        name: iab-xapp-model-node2
    inference_models_node3:
        name: iab-xapp-model-node3
    inference_models_node4:
        name: iab-xapp-model-node4
    inference_models_node5:
        name: iab-xapp-model-node5