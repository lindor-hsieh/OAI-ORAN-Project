# ==========================================
# 網路定義區
# ==========================================
networks:
    # 1. 外部 Macvlan 網路 (綁定 PC 2 實體網卡)
    macvlan_net:
        driver: macvlan
        driver_opts:
            parent: enxc84d44350008  # 確保這是你 PC 2 實際對外的網卡名稱
        ipam:
            config:
                - subnet: 192.168.88.0/24    # 與 PC 1 同網段
                  gateway: 192.168.88.1      # 假設 PC 1 是 Gateway，或填真實 Gateway
                  ip_range: 192.168.88.128/25 # 預留高位 IP 給 Docker，避免跟主機衝突

    # 2. 內部 Bridge 網路 (DU 與 End-UE 專用)
    iab_internal_net:
        driver: bridge
        ipam:
            config:
                - subnet: 192.168.74.0/24