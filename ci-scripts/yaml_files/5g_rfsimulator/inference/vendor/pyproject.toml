[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flwr"
version = "1.28.0"
description = "Flower: A Friendly Federated AI Framework (vendored, editable install)"
license = "Apache-2.0"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "grpcio>=1.70.0,<2.0.0",
    "grpcio-health-checking>=1.70.0,<2.0.0",
    "protobuf>=5.28.0,<7.0.0",
    "cryptography>=46.0.5,<47.0.0",
    "pycryptodome>=3.18.0,<4.0.0",
    "iterators>=0.0.2,<0.0.3",
    "typer>=0.12.5,<0.21.0",
    "tomli>=2.0.1,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "pathspec>=0.12.1,<0.13.0",
    "rich>=13.5.0,<14.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "click>=8.0.0,<9.0.0",
    "SQLAlchemy>=2.0.45,<3.0.0",
    "alembic>=1.18.1,<2.0.0",
]

[project.scripts]
flwr = "flwr.cli.app:app"
flwr-simulation = "flwr.simulation.app:flwr_simulation"
flower-superlink = "flwr.server.app:run_superlink"
flower-supernode = "flwr.supernode.cli:flower_supernode"
flower-superexec = "flwr.supercore.cli:flower_superexec"
flwr-serverapp = "flwr.server.serverapp:flwr_serverapp"
flwr-clientapp = "flwr.supernode.cli:flwr_clientapp"

[tool.poetry]
packages = [{ include = "flwr" }]
